syntax = "proto3";

package aggregator;

service Aggregator {
  rpc Add (AddRequest) returns (AddResponse);
  rpc GetTotal (GetRequest) returns (GetResponse);
}

message AddRequest {
  string key = 1;
  int32 value = 2;
}

message AddResponse {
  string status = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  int32 total = 1;
}
